# ============================================================================
#  Modbus 远程调试台 · 多平台编译
# ----------------------------------------------------------------------------
#  产物：
#    · Linux（Debian 系）  ：.deb / .AppImage / .rpm
#    · Windows x64          ：.msi / .exe(NSIS)
#    · Windows x86（32 位） ：.exe(NSIS)        ← 实验性，见下方说明
#    · macOS（Universal）   ：.dmg / .app       ← arm64 + x86_64 合一的通用二进制
#
#  触发：
#    · push 到 main/master（仅本仓库源码或本文件变更时）
#    · 打 tag desktop-v*（额外创建 GitHub Release，把全部产物挂上去）
#    · 手动 workflow_dispatch
#
#  说明：
#    · Linux 固定 ubuntu-22.04（glibc 2.35），deb 可覆盖 Debian 12 / Ubuntu 22.04+；
#    · macOS 用 --target universal-apple-darwin，一次构建同时满足 Intel / Apple Silicon；
#    · Windows 32 位（i686）依赖 32 位 WebView2 运行时，设了 continue-on-error：
#      失败不会拖红整条流水线，但该 job 仍会显示为失败；不需要 32 位时删掉该矩阵项即可。
# ============================================================================
name: Desktop Client · 多平台编译

on:
  push:
    branches: [main, master]
    tags: ['desktop-v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/desktop-client.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/desktop-client.yml'
  workflow_dispatch:

# 打 tag 时用 GITHUB_TOKEN 建 Release
permissions:
  contents: write

# 同一分支/标签只跑一条，新推送取消旧任务
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # 0) 先跑协议层单测，挂了就不浪费多平台编译时间
  # --------------------------------------------------------------------------
  test:
    name: 单测（协议 + 网关 e2e）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 单测 + 网关 e2e
        run: |
          npm ci
          npm test

  # --------------------------------------------------------------------------
  # 0b) 发布配置闸门：**在花多平台编译时间之前**判定 broker 配置是否齐全
  #     打 tag 时缺任何一项 → 直接失败，绝不产出"连不上 broker"的安装包。
  #     非 tag 构建缺少时只告警（产物可在界面「设置」里填 broker）。
  #     日志里只打印长度，不打印值。
  # --------------------------------------------------------------------------
  config-gate:
    name: 发布配置闸门
    runs-on: ubuntu-22.04
    steps:
      - name: 校验 broker 配置（tag 发布时必须齐全）
        env:
          VITE_MQTT_HOST: ${{ secrets.MQTT_HOST }}
          VITE_MQTT_PORT: ${{ secrets.MQTT_PORT }}
          VITE_MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          VITE_MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        run: |
          set -u
          # 只打印长度，不把值打进日志
          echo "broker env 长度: host=${#VITE_MQTT_HOST} port=${#VITE_MQTT_PORT} user=${#VITE_MQTT_USERNAME} pass=${#VITE_MQTT_PASSWORD}"

          missing=""
          [ -n "$VITE_MQTT_HOST" ]     || missing="$missing MQTT_HOST"
          [ -n "$VITE_MQTT_PORT" ]     || missing="$missing MQTT_PORT"
          [ -n "$VITE_MQTT_USERNAME" ] || missing="$missing MQTT_USERNAME"
          [ -n "$VITE_MQTT_PASSWORD" ] || missing="$missing MQTT_PASSWORD"

          if [ -n "$missing" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::发布构建缺少 Secrets:$missing —— 检查 Settings → Secrets and variables → Actions。已中止，避免发出连不上 broker 的安装包。"
              exit 1
            fi
            echo "::warning::缺少 Secrets:$missing —— 本次产物没有内置 broker 配置（需在界面「设置」里填）。打 tag 发布时这里会直接失败。"
          else
            echo "broker 配置齐全 ✓"
          fi

  # --------------------------------------------------------------------------
  # 1) 多平台打包
  # --------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: [test, config-gate]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          #   bundles 留空 = 用 tauri.conf.json 的 targets:"all"（deb / AppImage / rpm）
          - name: linux-x64
            os: ubuntu-22.04
            rust_targets: ''
            target: ''
            bundles: ''

          # Windows x64
          #   ★ 只出 NSIS(.exe)，**不出 MSI**：WiX 3 的 light.exe 用 code page 1252
          #   （en-US 数据库）链接，遇到非 Latin-1 字符一律报 LGHT0311，中文界面文字会直接
          #   让打包失败。NSIS 是 Tauri 在 Windows 上的默认推荐格式，安装界面跟随系统语言，
          #   中文没有任何限制；且在没有代码签名证书时，前端就能构建出可用的安装包。
          #   （产品名也一并改成纯 ASCII "Modbus Remote Bench"，但仅靠它并不能保证
          #    MSI 里的中文全部消失，所以这里直接不产 MSI。）
          - name: windows-x64
            os: windows-latest
            rust_targets: ''
            target: ''
            bundles: nsis

          # Windows x86
          - name: windows-x86
            os: windows-latest
            rust_targets: i686-pc-windows-msvc
            target: i686-pc-windows-msvc
            bundles: nsis

          # macOS Universal（arm64 + x86_64）：DMG + app
          - name: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: ''
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # Tauri v2 在 Linux 上需要的系统库（webkit2gtk-4.1 / AppIndicator / rsvg）
      #   ★ 加固点（历史 linux-x64 失败过、原因未取到日志，故按最可能的原因兜底）：
      #     · apt 与 dpkg 并发会偶发 "Could not get lock"：清掉残留进程 + 锁文件后重试；
      #     · 逐个包安装并打印 pkg-config 版本，任何缺包都能在日志里一眼看到是哪一个；
      #     · 解除 22.04 runner 上可能存在的 held 包，避免 update 半途而废。
      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          sudo killall -q apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
          sudo dpkg --configure -a || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libfuse2 \
            patchelf \
            build-essential \
            curl wget file
          echo "==== 依赖核验 ===="
          for pkg in webkit2gtk-4.1 gtk+-3.0 librsvg-2.0 libayatana-appindicator3-0.1 xdo; do
            printf '  %-32s ' "$pkg"
            pkg-config --modversion "$pkg" 2>/dev/null || echo "缺失"
          done
          echo "  patchelf: $(patchelf --version 2>/dev/null || echo 缺失)"

      - name: 安装前端依赖
        run: npm ci

      # rust-cache 会把上一次的 bundle/ 一起还原，里面可能有旧 productName 的安装包（甚至空壳），
      # 若不清理，下面的 find / upload-artifact 会抓到陈旧文件。先清掉再编译。
      - name: 清理缓存里的旧安装包
        shell: bash
        run: |
          rm -rf src-tauri/target/*/release/bundle src-tauri/target/release/bundle 2>/dev/null || true
          echo "---- 清理后剩余 bundle ----"
          find src-tauri/target -maxdepth 6 -path '*/release/bundle/*' -type f 2>/dev/null | sort || echo "(none)"

      # broker 配置全部由 GitHub Secrets 注入构建期环境变量（vite build 阶段读 VITE_MQTT_*）
      # 源码 / git 历史里不含真实地址、端口、账号、密码；没配 Secrets 就是空配置
      - name: 编译 Tauri（${{ matrix.name }}）
        shell: bash
        env:
          VITE_MQTT_HOST: ${{ secrets.MQTT_HOST }}
          VITE_MQTT_PORT: ${{ secrets.MQTT_PORT }}
          VITE_MQTT_PATH: ${{ secrets.MQTT_PATH }}
          VITE_MQTT_SECURE: ${{ secrets.MQTT_SECURE }}
          VITE_MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          VITE_MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          VITE_MQTT_KEEPALIVE: ${{ secrets.MQTT_KEEPALIVE }}
        run: |
          # 只打印长度，不把值打进日志
          echo "broker env 长度: host=${#VITE_MQTT_HOST} port=${#VITE_MQTT_PORT} user=${#VITE_MQTT_USERNAME} pass=${#VITE_MQTT_PASSWORD}"

          # tag 发布：四项缺一不可。config-gate 已经在编译前拦过一遍，这里再拦一次是为了
          # 防止"非 tag 构建通过 → 事后转成 tag 重跑"这类路径漏网。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            missing=""
            [ -n "$VITE_MQTT_HOST" ]     || missing="$missing MQTT_HOST"
            [ -n "$VITE_MQTT_PORT" ]     || missing="$missing MQTT_PORT"
            [ -n "$VITE_MQTT_USERNAME" ] || missing="$missing MQTT_USERNAME"
            [ -n "$VITE_MQTT_PASSWORD" ] || missing="$missing MQTT_PASSWORD"
            if [ -n "$missing" ]; then
              echo "::error::发布构建缺少 Secrets:$missing —— 已中止，不产出连不上 broker 的安装包"
              exit 1
            fi
            echo "发布构建：broker 配置齐全 ✓"
          elif [ -z "$VITE_MQTT_HOST" ]; then
            echo "::warning::VITE_MQTT_HOST 为空，产物将没有内置 broker 配置（需在界面「设置」里填）"
          fi

          # ★ 不再把 matrix.build_args 拼成一行（多词会被拆开、后一个 --bundles 会覆盖前一个）。
          #   逐项数组传递：--target 一项、--bundles 一项。
          args=()
          if [ -n "${{ matrix.target }}" ]; then args+=(--target "${{ matrix.target }}"); fi
          if [ -n "${{ matrix.bundles }}" ]; then args+=(--bundles "${{ matrix.bundles }}"); fi
          echo "tauri build ${args[*]:-(默认 targets=all)}"

          npx tauri build "${args[@]}"
          echo "---- bundles ----"
          find src-tauri/target -maxdepth 6 -path '*/release/bundle/*' -type f | sort || true

      - name: 上传产物（${{ matrix.name }}）
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm

  # --------------------------------------------------------------------------
  # 2) 打 tag（desktop-v*）时把全部产物挂到 Release；普通 push / PR 不跑
  # --------------------------------------------------------------------------
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v3
        with:
          name: Modbus Remote Bench ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # 直接发布（不是草稿）：产物立刻出现在 Releases 页，可被直接下载
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
